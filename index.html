    <title>Will You Be My Valentine?</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Quicksand', sans-serif;
        overflow: hidden;
      }
      .romantic-title {
        font-family: 'Dancing Script', cursive;
      }
      @keyframes pulse-soft {
        0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(244, 114, 182, 0.4); }
        50% { transform: scale(1.05); box-shadow: 0 0 20px 10px rgba(244, 114, 182, 0.2); }
      }
      .animate-pulse-soft {
        animation: pulse-soft 2s infinite ease-in-out;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      .animate-float {
        animation: float 3s infinite ease-in-out;
      }
      @keyframes fadeInScale {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-entrance {
        animation: fadeInScale 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>
